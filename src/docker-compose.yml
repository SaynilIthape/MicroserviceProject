version: '3.8'

services:

  catalogdb:
    container_name: catalogdb
    image: postgres:18
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: CatalogDb
    volumes:
      - postgres_catalog:/var/lib/postgresql
    ports:
      - "5432:5432"

  #RAG implementation with pgvector
  # catalogdb:
  #   image: ankane/pgvector
  #   container_name: catalogdb
  #   environment:
  #       POSTGRES_USER: postgres
  #       POSTGRES_PASSWORD: mysecret
  #       POSTGRES_DB: catalogDb
  #   volumes:
  #      - postgres_catalog:/var/lib/postgresql
  #   ports:
  #       - "5432:5432"

  basketdb:
    container_name: basketdb
    image: postgres:18
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: BasketDb
    volumes:
      - postgres_basket:/var/lib/postgresql
    ports:
      - "5433:5432"

  distributedache:
    container_name: distributedache
    image: redis:7
    restart: always 
    ports:
      - "6379:6379"
   
  orderdb:
    container_name: orderdb
    image: mcr.microsoft.com/mssql/server
    environment:
        - ACCEPT_EULA=Y
        - SA_PASSWORD=Strong@12345
    restart: always
    ports:
        - "1433:1433"

  catalogapi:
    container_name: catalogapi
    build:
      context: .
      dockerfile: Services/Catalogue/CatalogAPI/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      - catalogdb
    ports:
      - "8000:80"

  basketapi:
    container_name: basketapi
    build:
      context: .
      dockerfile: Services/Basket/Basket.API/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      - basketdb
    ports:
      - "8001:80"

  # ollama:
  #   image: ollama/ollama
  #   container_name: ollama
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama_data:/root/.ollama
  #   restart: always

  discount.grpc:
    image: ${DOCKER_REGISTRY-}discountgrpc
    build:
      context: .
      dockerfile: Services/Discount/Discount.Grpc/Dockerfile
    volumes:
      - ./data:/app/data
volumes:
  postgres_catalog:
  postgres_basket:
  ollama_data:  
  discount_data:
